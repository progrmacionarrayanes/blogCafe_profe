<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto</title>
    <meta
      name="description"
      content="Página web de blog de café, cursos de café"
    />

    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./css/normalize.css" />

    <!--Fuentes Open Sans-->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=PT+Sans:ital,wght@0,400;0,700;1,400;1,700&family=
    Staatliches&display=swap"
      rel="stylesheet"
    />

    <!--Fuente PT Sans-->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=PT+Sans:ital,
    wght@0,400;0,700;1,400;1,700&family=Staatliches&display=swap"
      rel="stylesheet"
    />


</head>
<body>
    <header class="header">
      <div class="contenedor">
        <div class="barra">
          <a class="logo" href="./index.html">
            <h1 class="logo__nombre no-margin centrar-texto">
              Blog<span class="logo__bold">DeCafé</span>
            </h1>
          </a>

          <nav class="navegacion">
            <a href="./entrada.html" class="navegacion__enlace">Nosotros</a>
            <a href="cursos.html" class="navegacion__enlace">Cursos</a>
            <a href="contacto.html" class="navegacion__enlace">Contacto</a>
          </nav>
        </div>

        <div class="header__texto">
          <h2 class="no-margin">Blog de café con consejos y cursos</h2>
          <p class="no-margin">
            Aprende de los expertos con las mejores recetas y consejos
          </p>
        </div>
      </div>
    </header>

    <main class="contenedor"> 
        <h3 class="centrar-texto">Contácto</h3>
         <div class="contacto-bg"></div>

         <form class="fomulario">
           <div class="campo">
            <label class="campo__label" for="nombre">Nombre</label>
            <input class="campo__input" type="text" id="nombre" placeholder="Tu nombre">

           </div>

           <div class="campo">
            <label class="campo__label" for="email">E-mail</label>
            <input class="campo__input" type="text" id="email" placeholder="Tu E-mail">

           </div> 

           <div class="campo">
            <label class="campo__label" for="mensaje">Nombre</label>
            <textarea  
            class="campo__field campo__field--textarea" type="text" id="mensaje" placeholder="Mensaje"> </textarea>

           </div>

            <div class="campo">
                <input type="submit" value="Enviar" class="boton boton--primario">
            </div>

         </form>


    </main>


    <!--Footer-->
      <footer class="footer">

       <div class="contenedor">
        <div class="barra">
          <a class="logo" href="./index.html">
            <h1 class="logo__nombre no-margin centrar-texto">
              Blog<span class="logo__bold">DeCafé</span>
            </h1>
          </a>

          <nav class="navegacion">
            <a href="nosotros.html" class="navegacion__enlace">Nosotros</a>
            <a href="cursos.html" class="navegacion__enlace">Cursos</a>
            <a href="contacto.html" class="navegacion__enlace">Contacto</a>
          </nav>
        </div>

    </footer>
    
</body>
</html>
